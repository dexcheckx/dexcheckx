<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header with logo and title -->
    <div class="header">
      <div class="logo">
        <img src="icons/icon-48.png" alt="DexCheckX">
      </div>
      <div class="title">
        <h1>DexCheckX</h1>
        <p>DexScreener Ad Monitor</p>
      </div>
    </div>

    <!-- Current Status -->
    <div class="status-section">
      <div class="status-item">
        <span class="status-label">Status:</span>
        <span id="current-status" class="status-value">Active</span>
      </div>
      <div class="status-item">
        <span class="status-label">Current Token:</span>
        <span id="current-token" class="status-value">None</span>
      </div>
    </div>

    <!-- Main Settings -->
    <div class="settings-section">
      <div class="setting-group">
        <div class="setting-item">
          <div class="setting-info">
            <span class="setting-label">Extension Enabled</span>
            <span class="setting-description">Turn monitoring on/off</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="extension-enabled" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="setting-item">
          <div class="setting-info">
            <span class="setting-label">Show Indicator</span>
            <span class="setting-description">Display floating indicator</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="show-indicator" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="setting-item">
          <div class="setting-info">
            <span class="setting-label">Monitor Interval</span>
            <span class="setting-description">API check frequency (seconds)</span>
          </div>
          <div class="setting-input">
            <input type="number" id="monitor-interval" value="5" min="1" max="60">
            <span class="input-suffix">s</span>
          </div>
        </div>

        <div class="setting-item">
          <div class="setting-info">
            <span class="setting-label">Indexing Check Interval</span>
            <span class="setting-description">New pair indexing frequency</span>
          </div>
          <div class="setting-input">
            <input type="number" id="indexing-interval" value="10" min="5" max="120">
            <span class="input-suffix">s</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="actions-section">
      <button id="refresh-status" class="action-button primary">
        <span class="button-icon">⟳</span>
        Refresh Status
      </button>
      <button id="reset-position" class="action-button secondary">
        <span class="button-icon">⌖</span>
        Reset Position
      </button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="version">v1.0</div>
      <div class="links">
        <a href="#" id="help-link">Help</a>
        <span class="separator">•</span>
        <a href="#" id="about-link">About</a>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
